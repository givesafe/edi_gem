---
# Reek reports where a heuristic matched, not what is wrong. Each finding is one of three:
#   1. the rule contradicts a Ruby or house convention: set here once, with the convention it yields to;
#   2. the rule fits, but one context is a deliberate exception: skipped beside the code, in the comment
#      above its method or class, with its reason first and then `# :reek:SmellName`;
#   3. the finding locates a design question: answered in the code, never quieted here.
# Never quiet a finding by moving a decision away from its owner. Where reek and rubocop check one
# rule, rubocop (.rubocop.yml) is authoritative and reek's check is off.
#
# `rake reek` reads this file from the root.

detectors:
  # --- 1. Conventions ---------------------------------------------------------------------------

  # Industry names, as the standards spell them (as .rubocop.yml's Naming/VariableNumber allows):
  # X12 transaction sets are numbered (270, 271), S3 is the service's name, and an address's lines
  # are line1 and line2 in X12's N3 segment and USPS addressing.
  UncommunicativeModuleName:
    accept: ["X12", "/\\ATransaction\\d{3}\\z/", "S3"]
  UncommunicativeParameterName:
    accept: ["line1", "line2"]
  UncommunicativeVariableName:
    accept: ["_", "/\\A@?line[12]\\z/"] # `_` is reek's own default, which a list replaces

  # Rubocop's Metrics/MethodLength and Metrics/AbcSize own method size.
  TooManyStatements:
    enabled: false

  # Rubocop's Metrics/ParameterLists owns parameter counts, with keyword arguments not counted:
  # a keyword names what it carries.
  LongParameterList:
    enabled: false

  # An absence the domain keeps distinct: no archive, no identification, a payer missing from the
  # directory, a person the payer didn't return. A Null Object is the answer when one absence is
  # checked in more than one place; review catches that, reek doesn't.
  NilCheck:
    enabled: false

  # Transforms over plans, benefits and their fields need two levels; a third is still flagged.
  NestedIterators:
    max_allowed_nesting: 2

directories:
  # A scripted stand-in for Stedi: scenario tables named by constant, chosen by an argument.
  "lib/edi_gem/source/mock":
    TooManyConstants:
      enabled: false
    ControlParameter:
      enabled: false
