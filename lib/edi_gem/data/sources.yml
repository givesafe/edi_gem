# Per-source transport policy: timeouts, retries, throttling, and which vendor failures map to
# which EdiGem::Fault kind.
#
# `defaults` applies to every source. A source declares only where it differs; sections are
# merged one level deep.

defaults:
  timeout: 30

  retry:
    # Safe because an eligibility inquiry is a read.
    attempts: 3          # total tries
    backoff: 0.5         # seconds before the first retry
    multiplier: 2
    max_delay: 20
    jitter: 0.25         # +/- this fraction
    # `retry_on`, not `on`: YAML 1.1 reads a bare `on` key as true.
    retry_on:
      - timeout
      - unreachable
      - rate_limited
      - vendor_unavailable
      - payer_unavailable
      - already_in_flight

  throttle:
    per_second: 5
    burst: 10

  errors:
    # A vendor's Retry-After wins over the backoff.
    retry_after_header: Retry-After

    status:
      "400": malformed_request
      "401": not_authorized
      "403": not_authorized
      "404": malformed_request
      "408": timeout
      "422": malformed_request
      "429": rate_limited
      "4xx": malformed_request
      "5xx": vendor_unavailable

    exceptions:
      Net::OpenTimeout: timeout
      Net::ReadTimeout: timeout
      Net::WriteTimeout: timeout
      Timeout::Error: timeout
      SocketError: unreachable
      Errno::ECONNREFUSED: unreachable
      Errno::ECONNRESET: unreachable
      Errno::EHOSTUNREACH: unreachable
      Errno::ENETUNREACH: unreachable
      Errno::EPIPE: unreachable
      OpenSSL::SSL::SSLError: unreachable
      IOError: unreachable

sources:
  stedi:
    base_url: https://healthcare.us.stedi.com
    # Stedi's limits are per endpoint, so timeouts and throttles are set per operation.
    operations:
      eligibility:
        path: /2024-04-01/change/medicalnetwork/eligibility/v3
        # Stedi holds a real-time check open for up to 120 seconds, asking the payer again
        # meanwhile, and warns that cancelling and sending again sooner adds requests in flight.
        # So the gem waits a little past that for Stedi's own answer. Stedi#eligibility starts no
        # send, a transport retry included, once two minutes have passed since its first.
        timeout: 125
        errors:
          # Stedi answers a payer ID it can't connect to with a 400 that holds an AAA 79 ("There is a
          # problem connecting with this payer"), so a 400 is read as an answer when it holds one.
          answer_in_status:
            - "400"
        retry:
          # Stedi busy is retried for those same two minutes, past `attempts`: Stedi's eligibility
          # troubleshooting page lists an HTTP 429 as a 42, "Retry immediately", and a 42 is retried
          # "for up to 2 minutes". The pauses between are the backoff's, or the Retry-After given.
          retry_until_end:
            - rate_limited
      # Stedi doesn't say that sending a discovery again after our own timeout is safe or unbilled:
      # the first may still be running, and its pages document no idempotency key for discovery.
      # So a timed-out send is not sent again. Every other kind is retried as by default.
      discovery:
        path: /2024-04-01/insurance-discovery/check/v1
        timeout: 130
        throttle:
          per_second: 1
          burst: 2
        # Stedi answers a discovery it couldn't complete with an ERROR body under HTTP 502.
        errors:
          answer_in_status:
            - "502"
        retry:
          retry_on:
            - unreachable
            - rate_limited
            - vendor_unavailable
            - payer_unavailable
            - already_in_flight
      # A discovery's results, polled under the name Stedi gave it: a read, retried as by default,
      # a timeout included. Stedi, insurance discovery: the results "can take up to 120 seconds to
      # return a response". Stedi limits it apart from the discovery send.
      discovery_results:
        path: /2024-04-01/insurance-discovery/check/v1
        timeout: 130
        throttle:
          per_second: 1
          burst: 2
        errors:
          answer_in_status:
            - "502"
      payer_search:
        path: /2024-04-01/payers/search

      # The batch endpoints are on a different host from the real-time ones.
      batch_eligibility:
        base_url: https://manager.us.stedi.com
        path: /2024-04-01/eligibility-manager/batch-eligibility
        timeout: 120
        throttle:
          per_second: 1
          burst: 2
        # As for a discovery send: Stedi doesn't say that submitting a batch again after our own
        # timeout makes no second batch, so a timed-out submit is not sent again.
        retry:
          retry_on:
            - unreachable
            - rate_limited
            - vendor_unavailable
            - payer_unavailable
            - already_in_flight
      batch_status:
        base_url: https://manager.us.stedi.com
        path: /2024-04-01/eligibility-manager/batch
      batch_checks:
        base_url: https://manager.us.stedi.com
        path: /2024-04-01/eligibility-manager/batch
        timeout: 120
      batch_results:
        base_url: https://manager.us.stedi.com
        path: /2024-04-01/eligibility-manager/polling/batch-eligibility
        timeout: 120
    throttle:
      per_second: 10
    errors:
      status:
        # Stedi's answer when a request reuses an Idempotency-Key still in progress, as it documents
        # for its claim endpoints; its eligibility, discovery and batch pages don't mention keys.
        "409": already_in_flight
    # Payers that will not answer through Stedi without the provider's own secret, by Stedi's
    # payer code, and the Credential keys each one needs. A request short of them is refused
    # before it is sent: the payer would answer it as if the provider were not enrolled.
    payer_credentials:
      # Medi-Cal: the provider's PIN, sent as portalPassword.
      "100065": [portal_password]

  # No base_url: the endpoint is assigned at enrolment and comes from the credential.
  office_ally:
    operations:
      eligibility:
        path: /
    errors:
      status:
        "503": vendor_unavailable

  # No base_url: the endpoint is not known yet and comes from the credential.
  optum:
    operations:
      eligibility:
        path: /
